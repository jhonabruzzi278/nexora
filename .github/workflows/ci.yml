name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/aws/bootstrap fmt -check
      - run: terraform -chdir=infra/aws/app fmt -check
      - run: terraform -chdir=infra/aws/bootstrap init -backend=false
      - run: terraform -chdir=infra/aws/bootstrap validate
      - run: terraform -chdir=infra/aws/app init -backend=false
      - run: terraform -chdir=infra/aws/app validate
      - name: Reject committed AWS access key IDs
        shell: bash
        run: |
          if git grep -nE '(AKIA|ASIA)[0-9A-Z]{16}'; then
            echo 'An AWS access key ID appears to be committed.' >&2
            exit 1
          fi
