name: destroy-aws-lab

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY_NEXORA_LAB to delete the deployed application
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexora-aws-lab
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    if: inputs.confirmation == 'DESTROY_NEXORA_LAB'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-lab

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false

      - name: Configure temporary AWS laboratory credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify destination and prepare artifact
        id: identity
        shell: bash
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$ACTUAL_ACCOUNT_ID" == "$EXPECTED_ACCOUNT_ID" ]]
          echo "account_id=$ACTUAL_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          bun install --frozen-lockfile
          bun run build:aws

      - name: Destroy application resources
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_aws_account_id: ${{ steps.identity.outputs.account_id }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_alert_email: ${{ vars.AWS_BUDGET_EMAIL }}
        run: |
          set -euo pipefail
          [[ "$STATE_BUCKET" == nexora-*-${AWS_REGION}-tfstate ]]
          terraform -chdir=infra/aws/app init -reconfigure \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=nexora/lab.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=infra/aws/app destroy -auto-approve -input=false

      - name: Record retained bootstrap resource
        run: echo "The private Terraform state bucket is intentionally retained." >> "$GITHUB_STEP_SUMMARY"
