name: deploy-aws-lab

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_NEXORA_LAB to authorize a billable AWS deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexora-aws-lab
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    if: inputs.confirmation == 'DEPLOY_NEXORA_LAB'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false

      - name: Configure temporary AWS laboratory credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify destination account
        id: identity
        shell: bash
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [[ ! "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "AWS_ACCOUNT_ID must be configured as a 12-digit environment variable." >&2
            exit 1
          fi
          if [[ "$ACTUAL_ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]]; then
            echo "The credentials belong to a different AWS account." >&2
            exit 1
          fi
          echo "account_id=$ACTUAL_ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Reject committed AWS access key IDs
        shell: bash
        run: |
          if git grep -nE '(AKIA|ASIA)[0-9A-Z]{16}'; then
            echo 'An AWS access key ID appears to be committed.' >&2
            exit 1
          fi

      - name: Install, test, and build
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build:aws

      - name: Verify remote state bucket
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$STATE_BUCKET" == nexora-*-${AWS_REGION}-tfstate ]]
          aws s3api head-bucket --bucket "$STATE_BUCKET"

      - name: Terraform plan
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_aws_account_id: ${{ steps.identity.outputs.account_id }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_alert_email: ${{ vars.AWS_BUDGET_EMAIL }}
        run: |
          terraform -chdir=infra/aws/app init -reconfigure \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=nexora/lab.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=infra/aws/app fmt -check
          terraform -chdir=infra/aws/app validate
          terraform -chdir=infra/aws/app plan -out=tfplan -input=false

      - name: Apply reviewed plan
        shell: bash
        env:
          TF_VAR_aws_account_id: ${{ steps.identity.outputs.account_id }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_alert_email: ${{ vars.AWS_BUDGET_EMAIL }}
        run: terraform -chdir=infra/aws/app apply -input=false -auto-approve tfplan

      - name: Publish private web assets
        shell: bash
        run: |
          WEB_BUCKET="$(terraform -chdir=infra/aws/app output -raw web_bucket_name)"
          DISTRIBUTION_ID="$(terraform -chdir=infra/aws/app output -raw cloudfront_distribution_id)"
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' >/dev/null

      - name: Smoke test API
        shell: bash
        run: |
          HEALTH_URL="$(terraform -chdir=infra/aws/app output -raw api_health_url)"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$HEALTH_URL"

      - name: Publish deployment URL
        shell: bash
        run: |
          APP_URL="$(terraform -chdir=infra/aws/app output -raw application_url)"
          echo "Nexora: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
